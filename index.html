<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Azimut - OpenStreetMap</title> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"> <style> html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; } #map { width: 100%; height: 70vh; } #panel { box-sizing: border-box; padding: 15px 20px; background: white; height: 30vh; } h2 { margin: 0 0 8px 0; color: #174ea6; } #message { margin-bottom: 10px; } .results { display: flex; gap: 30px; flex-wrap: wrap; } .label { color: #666; font-size: 13px; } .value { font-size: 20px; font-weight: bold; color: #174ea6; } button { margin-top: 12px; padding: 8px 15px; background: #174ea6; color: white; border: none; border-radius: 5px; cursor: pointer; } button:hover { background: #0d3b80; } .azimut-label { background: transparent; border: none; } </style> </head> <body> <div id="map"></div> <div id="panel"> <h2>🧭 Calculateur d'azimut</h2> <div id="message"> Cliquez sur la carte pour placer le <b>point A</b>. </div> <div class="results"> <div> <div class="label">Azimut A → B</div> <div class="value" id="azimut">—</div> </div> <div> <div class="label">Distance</div> <div class="value" id="distance">—</div> </div> <div> <div class="label">Direction</div> <div class="value" id="direction">—</div> </div> <div> <div class="label">Point A</div> <div id="coordA">—</div> </div> <div> <div class="label">Point B</div> <div id="coordB">—</div> </div> </div>

<button onclick="resetCarte()">Réinitialiser</button>

</div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <script> /* ========================================================= CRÉATION DE LA CARTE ========================================================= */ const map = L.map("map").setView( [46.8034, -71.2172], 16 ); /* Fond OpenStreetMap */ L.tileLayer( "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" } ).addTo(map); /* ========================================================= VARIABLES ========================================================= */ let A = null; let B = null; let markerA = null; let markerB = null; let ligne = null; /* Nouveau : rapporteur */ let rapporteur = null; /* ========================================================= CLIC SUR LA CARTE ========================================================= */ map.on("click", function(e) { /* Premier clic = A */ if (A === null) { A = e.latlng; markerA = L.marker(A) .addTo(map) .bindPopup( "<b>Point A</b><br>" + A.lat.toFixed(6) + ", " + A.lng.toFixed(6) ) .openPopup(); document.getElementById("coordA").innerHTML = A.lat.toFixed(6) + ", " + A.lng.toFixed(6); document.getElementById("message").innerHTML = "Point A placé. Cliquez maintenant pour placer le <b>point B</b>."; /* Création du rapporteur */ creerRapporteur(); return; } /* Deuxième clic = B */ else if (B === null) { B = e.latlng; markerB = L.marker(B, {
    draggable: true
})
.addTo(map)
.bindPopup(
    "<b>Point B</b><br>" +
    B.lat.toFixed(6) +
    ", " +
    B.lng.toFixed(6)
)
.openPopup();


/* B peut maintenant être déplacé */

markerB.on("drag", function(e) {

    B = e.target.getLatLng();

    /* Mise à jour des coordonnées */

    document.getElementById("coordB").innerHTML =
        B.lat.toFixed(6) +
        ", " +
        B.lng.toFixed(6);


    /* Déplacement de la ligne */

    if (ligne) {
        ligne.setLatLngs([A, B]);
    }


    /* Recalcul de l'azimut */

    calculerAzimut(A, B);

});
 document.getElementById("coordB").innerHTML = B.lat.toFixed(6) + ", " + B.lng.toFixed(6); /* Ligne A → B */ ligne = L.polyline( [A, B], { color: "red", weight: 4 } ).addTo(map); /* Calcul */ calculerAzimut(A, B); document.getElementById("message").innerHTML = "<b>A → B</b> terminé. Cliquez sur Réinitialiser pour recommencer."; return; } }); /* ========================================================= CRÉATION DU RAPORTEUR ========================================================= */ function creerRapporteur() { if (!A) return; if (rapporteur) map.removeLayer(rapporteur); rapporteur = L.layerGroup().addTo(map); dessinerRapporteur(); } /* ========================================================= CALCUL D'UN POINT À PARTIR D'UN AZIMUT ========================================================= */ function destination(point, bearing, distance) { const R = 6371000; const lat1 = point.lat * Math.PI / 180; const lon1 = point.lng * Math.PI / 180; const brng = bearing * Math.PI / 180; const d = distance / R; const lat2 = Math.asin( Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng) ); const lon2 = lon1 + Math.atan2( Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2) ); return L.latLng( lat2 * 180 / Math.PI, lon2 * 180 / Math.PI ); } /* ========================================================= DESSIN DU RAPORTEUR ========================================================= */ function dessinerRapporteur() { if (!A || !rapporteur) return; rapporteur.clearLayers(); /* Taille visuelle du rapporteur. On veut qu'il garde une taille raisonnable à l'écran, même lorsque l'on zoome. */ const largeurCarte = map.getSize().x; const rayonPixels = Math.min( Math.max(140, largeurCarte * 0.20), 260 ); /* Conversion du rayon en mètres. */ const centrePixel = map.latLngToContainerPoint(A); const bordPixel = L.point( centrePixel.x + rayonPixels, centrePixel.y ); const bordLatLng = map.containerPointToLatLng(bordPixel); const rayonMetres = map.distance(A, bordLatLng); /* Cercle principal. */ L.circle( A, { radius: rayonMetres, color: "#174ea6", weight: 2, fillColor: "#4d90fe", fillOpacity: 0.04, interactive: false } ).addTo(rapporteur); /* Le niveau de détail change avec le zoom. */ let intervalle; if (map.getZoom() >= 18) { /* Très zoomé : tous les 5° */ intervalle = 5; } else if (map.getZoom() >= 16) { /* Zoom normal : tous les 10° */ intervalle = 10; } else { /* Vue plus éloignée : tous les 30° */ intervalle = 30; } /* Dessin des graduations. */ for ( let angle = 0; angle < 360; angle += intervalle ) { const grandeGraduation = angle % 30 === 0; const moyenneGraduation = angle % 10 === 0; let longueur; if (grandeGraduation) longueur = 18; else if (moyenneGraduation) longueur = 11; else longueur = 7; /* Point extérieur. */ const exterieur = destination( A, angle, rayonMetres ); /* Point intérieur. */ const rayonInterieur = rayonMetres - longueur * rayonMetres / rayonPixels; const interieur = destination( A, angle, rayonInterieur ); /* Graduation. */ L.polyline( [interieur, exterieur], { color: "#174ea6", weight: grandeGraduation ? 3 : 1, interactive: false } ).addTo(rapporteur); /* Étiquette des angles. À zoom 16+ : tous les 10°. À zoom faible : tous les 30°. */ if ( angle % 30 === 0 || (map.getZoom() >= 16 && angle % 10 === 0) ) { const labelPoint = destination( A, angle, rayonMetres * 1.12 ); let couleur = "#174ea6"; /* Nord en rouge. */ if (angle === 0) couleur = "#d71920"; /* Taille du texte. */ const taille = angle % 30 === 0 ? "13px" : "10px"; L.marker( labelPoint, { icon: L.divIcon({ className: "azimut-label", html: "<div style=\"" + "font-family:Arial;" + "font-size:" + taille + ";" + "font-weight:bold;" + "color:" + couleur + ";" + "text-align:center;" + "white-space:nowrap;" + "\">" + angle + "°" + "</div>", iconSize: [40, 20], iconAnchor: [20, 10] }), interactive: false } ).addTo(rapporteur); } } /* Points cardinaux. */ ajouterCardinal( 0, "N", "#d71920" ); ajouterCardinal( 90, "E", "#174ea6" ); ajouterCardinal( 180, "S", "#174ea6" ); ajouterCardinal( 270, "O", "#174ea6" ); } /* ========================================================= POINTS CARDINAUX ========================================================= */ function ajouterCardinal( angle, texte, couleur ) { const position = destination( A, angle, calculerRayon() * 1.20 ); L.marker( position, { icon: L.divIcon({ className: "", html: "<div style=\"" + "font-family:Arial;" + "font-size:18px;" + "font-weight:bold;" + "color:" + couleur + ";" + "text-align:center;" + "\">" + texte + "</div>", iconSize: [30, 30], iconAnchor: [15, 15] }), interactive: false } ).addTo(rapporteur); } /* ========================================================= CALCUL DU RAYON ========================================================= */ function calculerRayon() { const largeurCarte = map.getSize().x; const rayonPixels = Math.min( Math.max(140, largeurCarte * 0.20), 260 ); const centrePixel = map.latLngToContainerPoint(A); const bordPixel = L.point( centrePixel.x + rayonPixels, centrePixel.y ); const bordLatLng = map.containerPointToLatLng( bordPixel ); return map.distance( A, bordLatLng ); } /* ========================================================= REDESSIN DU RAPORTEUR ========================================================= */ map.on( "zoomend", function() { if (A) dessinerRapporteur(); } ); map.on( "moveend", function() { if (A) dessinerRapporteur(); } ); map.on( "resize", function() { if (A) dessinerRapporteur(); } ); /* ========================================================= CALCUL DE L'AZIMUT ========================================================= */ function calculerAzimut(A, B) { const rad = Math.PI / 180; const deg = 180 / Math.PI; const lat1 = A.lat * rad; const lat2 = B.lat * rad; const deltaLon = (B.lng - A.lng) * rad; const y = Math.sin(deltaLon) * Math.cos(lat2); const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLon); let azimut = Math.atan2(y, x) * deg; if (azimut < 0) azimut += 360; /* Degrés / minutes / secondes */ const d = Math.floor(azimut); const minDecimal = (azimut - d) * 60; const m = Math.floor(minDecimal); const s = (minDecimal - m) * 60; document.getElementById( "azimut" ).innerHTML = azimut.toFixed(4) + "°<br>" + "<small>" + d + "° " + m + "′ " + s.toFixed(1) + "″" + "</small>"; /* Distance */ const R = 6371000; const dLat = (B.lat - A.lat) * rad; const dLon = (B.lng - A.lng) * rad; const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2; const distance = R * 2 * Math.atan2( Math.sqrt(h), Math.sqrt(1 - h) ); document.getElementById( "distance" ).innerHTML = distance.toFixed(2) + " m"; /* Direction */ let direction; if ( azimut < 22.5 || azimut >= 337.5 ) direction = "Nord"; else if (azimut < 67.5) direction = "Nord-Est"; else if (azimut < 112.5) direction = "Est"; else if (azimut < 157.5) direction = "Sud-Est"; else if (azimut < 202.5) direction = "Sud"; else if (azimut < 247.5) direction = "Sud-Ouest"; else if (azimut < 292.5) direction = "Ouest"; else direction = "Nord-Ouest"; document.getElementById( "direction" ).innerHTML = direction; } /* ========================================================= RÉINITIALISATION ========================================================= */ function resetCarte() { if (markerA) map.removeLayer(markerA); if (markerB) map.removeLayer(markerB); if (ligne) map.removeLayer(ligne); if (rapporteur) map.removeLayer(rapporteur); A = null; B = null; markerA = null; markerB = null; ligne = null; rapporteur = null; document.getElementById( "azimut" ).innerHTML = "—"; document.getElementById( "distance" ).innerHTML = "—"; document.getElementById( "direction" ).innerHTML = "—"; document.getElementById( "coordA" ).innerHTML = "—"; document.getElementById( "coordB" ).innerHTML = "—"; document.getElementById( "message" ).innerHTML = "Cliquez sur la carte pour placer le <b>point A</b>."; } </script> </body> </html>
